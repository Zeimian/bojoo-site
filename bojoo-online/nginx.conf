###############################################################################
# Bojoo Online — Nginx 配置模板
# 部署路径：/etc/nginx/sites-available/bojoo
# 启用：sudo ln -s /etc/nginx/sites-available/bojoo /etc/nginx/sites-enabled/bojoo
###############################################################################

# ========== HTTP → HTTPS 强制跳转 ==========
server {
    listen 80;
    listen [::]:80;
    server_name bojoo.online *.bojoo.online;
    return 301 https://$host$request_uri;
}

# ========== 通用 SSL 设置（所有子域名共享） ==========
# SSL 证书路径（Certbot 自动生成）
ssl_certificate     /etc/letsencrypt/live/bojoo.online/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/bojoo.online/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# 安全头
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# ========== 主导航门户 bojoo.online ==========
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bojoo.online;

    root /var/www/bojoo/main;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/bojoo-main.access.log;
    error_log  /var/log/nginx/bojoo-main.error.log;
}

